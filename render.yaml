# Render Blueprint: iki ortam.
#   UAT   -> uat dalı. Her push'ta otomatik yüklenir; onay öncesi test burada yapılır.
#   CANLI -> main dalı. Sadece UAT'de "uygundur" onayı verilen sürüm main'e alınır.
# Ayrıntılar: docs/SURUM_SURECI.md
services:
  - type: web
    name: nba-fantasy-uat
    runtime: python
    plan: free
    branch: uat
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: uat
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      # BASE_URL verilmezse Render'ın kendi adresi (RENDER_EXTERNAL_URL) kullanılır.
      # Yahoo girişi açılınca YAHOO_CLIENT_ID / YAHOO_CLIENT_SECRET panelden eklenir.

  - type: web
    name: nba-fantasy
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: canli
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Yahoo erişimi onaylanıp gerçek kullanıcılar gelene kadar demo açık.
      - key: DEMO_MODE
        value: "true"
      # Alan adı alınınca: BASE_URL=https://alanadiniz.com
      # Gerçek kullanıcı verisi saklanmaya başlamadan önce PostgreSQL'e geçilmeli
      # (ücretsiz planda disk kalıcı değil): DATABASE_URL
